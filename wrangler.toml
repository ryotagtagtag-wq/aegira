name = "aegira"
main = "src/worker/index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/admin", "/device"]
not_found_handling = "404-page"

[[durable_objects.bindings]]
name = "GATEWAY_STATE"
class_name = "GatewayState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayState"]
